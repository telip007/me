[project]
name = "personal-blog"
version = "2.0.0"
description = "An English Markdown journal served with FastAPI and HTMX"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.135,<0.136",
  "uvicorn[standard]>=0.41,<1",
  "jinja2>=3.1.6,<4",
  "markdown-it-py>=4,<5",
  "pyyaml>=6.0.3,<7",
  "httpx>=0.28,<1",
  "linkify-it-py>=2,<3",
  "starlette>=1.3.1,<1.4",
  "pillow>=13,<14",
]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.15,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110
