name: Deploy Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync --locked
      - run: uv run --locked ruff check blog tests scripts/export.py scripts/check_content.py
      - run: npm test
      - run: uv run --locked python scripts/check_content.py
      - run: npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://goeksu.me
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200
        with:
          version: "0.4.122"
      - name: Deploy checked commit
        run: flyctl deploy --remote-only --ha=false --strategy rolling --build-arg GIT_REVISION="$GITHUB_SHA"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Check release health
        run: curl --fail --retry 5 --retry-delay 5 https://goeksu-blog.fly.dev/healthz
